<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>tente abrir esse site em varios dispositivos diferentes ou simplismente aumente ou diminua o tamnho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="Imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="Imagens/foto-m.png" type="image/png">
        <img src="Imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzinhdo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="Midia/Gravando.m4a" type="audio/mpag">
        <source src="Midia/Gravando.m4a" type="audio/ogg">
        <source src="Midia/Gravando.m4a" type="wav">
        <p>Infelizmente seu navegador nao consegue reproduzir áudio. <a href="Midia/Gravando.m4a"></a>Clique aqui para baixar o arquivo MP3</p>
    </audio>
</body>
</html>
